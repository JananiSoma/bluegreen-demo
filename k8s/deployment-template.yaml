apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-__COLOR__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
      color: __COLOR__
  template:
    metadata:
      labels:
        app: demo
        color: __COLOR__
    spec:
      containers:
      - name: demo
        image: __IMAGE__
        env:
        - name: APP_VERSION
          value: "__VERSION__"
        ports:
        - containerPort: 3000
